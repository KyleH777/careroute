# CI: lint → tests (+ migration round-trip) → build, scan, publish.
#
# Tests run through the same docker-compose.test.yml used locally, so a
# green CI run means exactly what a green local run means. The image is only
# pushed to GHCR from main, and only if the Trivy scan finds no fixable
# HIGH/CRITICAL vulnerabilities.
#
# Base images come from Docker Hardened Images (dhi.io), which requires a
# Docker account to pull. Set two repository secrets:
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub personal access token (read-only is enough)

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.74.0"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app

  test:
    name: Tests & migrations
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p careroute-test -f docker-compose.test.yml
    steps:
      - uses: actions/checkout@v5
      - name: Log in to dhi.io (hardened base images)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run pytest against ephemeral Postgres
        run: $COMPOSE run --build --rm test
      - name: Migration round-trip (downgrade base → upgrade head)
        run: |
          $COMPOSE run --rm migrate alembic downgrade base
          $COMPOSE run --rm migrate alembic upgrade head
      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  image:
    name: Build, scan & publish image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to dhi.io (hardened base images)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: careroute:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            careroute:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Provenance records the base image, which lets Docker Scout apply
          # the hardened base's VEX statements to this image. SBOM lists
          # every package for anyone auditing the published image.
          provenance: mode=max
          sbom: true
