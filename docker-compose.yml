# CareRoute dev stack: Postgres + migrations + api.
#
#   docker compose up --build     start everything
#   docker compose down           stop (data survives in the named volume)
#   docker compose down -v        stop AND destroy the database
#
# Startup is ordered: db must report healthy, then `migrate` runs
# `alembic upgrade head` and exits 0, and only then does api start. That
# means the api never serves traffic against an un-migrated schema.

services:
  db:
    image: postgres:16-alpine
    container_name: careroute-db
    environment:
      POSTGRES_USER: careroute
      POSTGRES_PASSWORD: careroute
      POSTGRES_DB: careroute
    ports:
      # Exposed so you can psql from the host. Dev credentials only.
      - "5432:5432"
    volumes:
      - careroute-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careroute -d careroute"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
    image: careroute:local
    container_name: careroute-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://careroute:careroute@db:5432/careroute
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
    image: careroute:local
    container_name: careroute-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://careroute:careroute@db:5432/careroute
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  careroute-pgdata:
